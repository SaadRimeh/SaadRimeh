<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-labelledby="title desc">
  <title id="title">Saad Rimeh driver telemetry</title>
  <desc id="desc">A Formula One inspired engineering identity card showing Saad Rimeh's role, availability, location, and product focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11161d" />
      <stop offset="1" stop-color="#080a0e" />
    </linearGradient>
    <linearGradient id="identity" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#181f29" />
      <stop offset="1" stop-color="#10151c" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff3045" />
      <stop offset="1" stop-color="#ff6b79" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#202731" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="260" rx="18" fill="url(#bg)" />
  <rect width="1280" height="260" rx="18" fill="url(#grid)" opacity=".34" />
  <rect x="1" y="1" width="1278" height="258" rx="17" fill="none" stroke="#2a323d" />
  <path d="M0 18V0H18M1262 0h18v18M0 242v18h18M1262 260h18v-18" fill="none" stroke="#ff3045" stroke-width="2" />
