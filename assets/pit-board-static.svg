<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-labelledby="title desc">
  <title id="title">Saad Rimeh animated pit board</title>
  <desc id="desc">A Formula One pit board showing the current project, availability, timezone, and collaboration status.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11151b" />
      <stop offset="1" stop-color="#080a0d" />
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop stop-color="#ff3045" stop-opacity="0" />
      <stop offset=".5" stop-color="#ff3045" />
      <stop offset="1" stop-color="#ff3045" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="230" rx="14" fill="url(#panel)" />
  <rect x="1" y="1" width="1278" height="228" rx="13" fill="none" stroke="#29303b" />
  <path d="M30 55H1250M30 180H1250" stroke="#262d37" />
  <path d="M270 55V180M540 55V180M810 55V180M1080 55V180" stroke="#262d37" />
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="30" y="34" fill="#f4f6f8" font-size="13" font-weight="700" letter-spacing="4">PIT WALL // LIVE SESSION</text>
    <circle cx="1070" cy="29" r="5" fill="#43f0b0" filter="url(#glow)"></circle>
    <text x="1088" y="34" fill="#43f0b0" font-size="11" letter-spacing="3">CONNECTED</text>
    <text x="1250" y="34" text-anchor="end" fill="#717b8b" font-size="11" letter-spacing="2">SR-01</text>
    <text x="30" y="82" fill="#727c8c" font-size="10" letter-spacing="3">CURRENT LAP</text>
    <text x="30" y="128" fill="#ff3045" font-size="30" font-weight="800">SKILLIUM</text>
    <text x="30" y="155" fill="#c7ccd4" font-size="11" letter-spacing="2">P06 // EDTECH</text>
    <text x="300" y="82" fill="#727c8c" font-size="10" letter-spacing="3">AVAILABILITY</text>
    <text x="300" y="128" fill="#f4f6f8" font-size="30" font-weight="800">OPEN</text>
    <text x="300" y="155" fill="#43f0b0" font-size="11" letter-spacing="2">FREELANCE &amp; COLLAB</text>
    <text x="570" y="82" fill="#727c8c" font-size="10" letter-spacing="3">TIMEZONE</text>
    <text x="570" y="128" fill="#f4f6f8" font-size="30" font-weight="800">UTC+3</text>
    <text x="570" y="155" fill="#c7ccd4" font-size="11" letter-spacing="2">SYRIA // REMOTE</text>
    <text x="840" y="82" fill="#727c8c" font-size="10" letter-spacing="3">STATUS</text>
    <text x="840" y="128" fill="#f4f6f8" font-size="30" font-weight="800">READY</text>
    <text x="840" y="155" fill="#43f0b0" font-size="11" letter-spacing="2">TO COLLABORATE</text>
    <text x="1110" y="82" fill="#727c8c" font-size="10" letter-spacing="3">SESSION</text>
    <g fill="#f4f6f8" font-size="24" font-weight="700">
      <text x="1110" y="126">00:00.000</text>
      <text x="1110" y="126" opacity="0">00:07.512</text>
      <text x="1110" y="126" opacity="0">00:16.240</text>
    </g>
    <text x="1110" y="155" fill="#c7ccd4" font-size="11" letter-spacing="2">GREEN FLAG</text>
    <text x="30" y="210" fill="#697384" font-size="10" letter-spacing="3">BUILD • SHIP • REFINE</text>
    <text x="1250" y="210" text-anchor="end" fill="#697384" font-size="10" letter-spacing="3">PRECISION UNDER PRESSURE</text>
  </g>
  <rect x="0" y="178" width="180" height="2" fill="url(#scan)"></rect>
</svg>