      <rect width="310" height="76" rx="9" fill="#0d1117" stroke="#3a424e" />
      <rect width="7" height="76" rx="3" fill="#ff3045" />
      <text x="26" y="29" fill="#ff3045" font-size="13" letter-spacing="2">P03 // LOCAL-FIRST</text>
      <text x="26" y="58" fill="#f4f6f8" font-size="22" font-weight="800">Wateera</text>
    </g>
    <g transform="translate(330 560)">
      <rect width="330" height="76" rx="9" fill="#0d1117" stroke="#3a424e" />
      <rect width="7" height="76" rx="3" fill="#ff3045" />
      <text x="26" y="29" fill="#ff3045" font-size="13" letter-spacing="2">P04 // BOOKING</text>
      <text x="26" y="58" fill="#f4f6f8" font-size="22" font-weight="800">Salloum Barbershop</text>
    </g>
    <g transform="translate(70 754)">
      <rect width="330" height="76" rx="9" fill="#0d1117" stroke="#3a424e" />
      <rect width="7" height="76" rx="3" fill="#ff3045" />
      <text x="26" y="29" fill="#ff3045" font-size="13" letter-spacing="2">P05 // FINTECH</text>
      <text x="26" y="58" fill="#f4f6f8" font-size="22" font-weight="800">React Native Wallet</text>
    </g>
    <g transform="translate(320 970)">
      <rect width="320" height="82" rx="9" fill="#101820" stroke="#967d2b" />
      <rect width="7" height="82" rx="3" fill="#ffcf45" />
      <text x="26" y="31" fill="#ffcf45" font-size="13" letter-spacing="2">P06 // EDTECH</text>
      <text x="26" y="62" fill="#f4f6f8" font-size="24" font-weight="900">Skillium</text>
    </g>
  </g>
  <g fill="#0b0e12" stroke="#ff3045" stroke-width="4">
    <circle cx="112" cy="150" r="10" />
    <circle cx="590" cy="260" r="10" />
    <circle cx="125" cy="398" r="10" />
    <circle cx="602" cy="590" r="10" />
    <circle cx="112" cy="790" r="10" />
    <circle cx="602" cy="1005" r="11" stroke="#ffcf45" />
  </g>
  <g filter="url(#glow)" transform="translate(112 150)">
    <path d="M-22-11H-10L-5-6H9L16-3H25V3H16L9 6H-5L-10 11H-22V5H-12V-5H-22Z" fill="#ff3045" stroke="#ff8190" />
    <rect x="-14" y="-14" width="8" height="6" rx="2" fill="#090c10" />
    <rect x="-14" y="8" width="8" height="6" rx="2" fill="#090c10" />
    <rect x="9" y="-10" width="7" height="5" rx="2" fill="#090c10" />
    <rect x="9" y="5" width="7" height="5" rx="2" fill="#090c10" />
  </g>
  <g transform="translate(128 1136)">
    <rect x="-15" y="-28" width="30" height="56" fill="url(#flag)" />
    <text x="30" y="5" fill="#f4f6f8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="3">FINISH</text>
  </g>
  <text x="360" y="1230" text-anchor="middle" fill="#6f7989" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="3">FOLLOW THE CAR // EXPLORE THE BUILDS</text>
